spring.application.name=juniemvc

# Database Configuration
# Use Flyway for schema management; disable Hibernate DDL auto
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Flyway (defaults usually work)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator exposure policy: expose only essential endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Shipment API typed properties
shipment.api.enforce-order-match-on-get=true
