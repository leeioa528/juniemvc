get:
  tags:
    - BeerOrder
  summary: List shipments for a beer order
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    - name: sort
      in: query
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Page of shipments
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: array
                items:
                  $ref: '../components/schemas/BeerOrderShipmentResponse.yaml'
              pageable:
                type: object
              totalElements:
                type: integer
              totalPages:
                type: integer
              number:
                type: integer
post:
  tags:
    - BeerOrder
  summary: Create a shipment for a beer order
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerOrderShipmentRequest.yaml'
  responses:
    '201':
      description: Created
      headers:
        Location:
          description: Location of the created shipment
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderShipmentResponse.yaml'
    '400':
      $ref: '../components/responses/Problem.yaml'