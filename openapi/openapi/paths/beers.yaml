get:
  tags:
    - Beer
  summary: List beers
  description: Retrieve beers with pagination. Optionally filter by beanName (matches beerName field, contains, case-insensitive) and beerStyle (contains, case-insensitive).
  operationId: listBeers
  parameters:
    - name: page
      in: query
      description: Zero-based page index.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 0
    - name: size
      in: query
      description: The size of the page to be returned.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 20
    - name: beanName
      in: query
      description: Optional filter that matches Beer.beerName (contains, case-insensitive).
      required: false
      schema:
        type: string
    - name: beerStyle
      in: query
      description: Optional filter that matches Beer.beerStyle (contains, case-insensitive).
      required: false
      schema:
        type: string
  responses:
    '200':
      description: A page of beers.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerPage.yaml'
          examples:
            default:
              summary: Example page
              value:
                content:
                  - id: 101
                    version: 1
                    beerName: Galaxy Cat IPA
                    beerStyle: IPA
                    upc: '0123456789012'
                    quantityOnHand: 120
                    price: 12.99
                    createdDate: 2025-01-15T10:15:30Z
                    updateDate: 2025-02-10T08:00:00Z
                number: 0
                size: 20
                totalElements: 1
                totalPages: 1
                sort:
                  sorted: true
                  unsorted: false
                  empty: false
                first: true
                last: true
                numberOfElements: 1
    '400':
      $ref: '../components/responses/Problem.yaml'
post:
  tags:
    - Beer
  summary: Create beer
  description: Create a new beer. Returns 201 with the created resource and a Location header.
  operationId: createBeer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas/Beer.yaml'
          # readOnly properties are ignored on input
        examples:
          create:
            summary: Create Beer example
            value:
              beerName: Galaxy Cat IPA
              beerStyle: IPA
              upc: '0123456789012'
              quantityOnHand: 120
              price: 12.99
  responses:
    '201':
      description: Created
      headers:
        Location:
          description: Absolute URL of the newly created resource.
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Beer.yaml'
    '400':
      $ref: '../components/responses/Problem.yaml'
